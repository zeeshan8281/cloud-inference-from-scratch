name: local-contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python }}
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} ruff check .
      - run: uv run --locked --python ${{ matrix.python }} python -m unittest discover -s tests -p 'test_*.py' -v

  distributed-admission:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --locked --python 3.12 python -m unittest tests.test_redis_admission -v
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
